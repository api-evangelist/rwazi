name: Rwazi
description: Rwazi is a hyper-local market intelligence and Decision AI platform whose
  product, Sena, combines a company's internal business data with real-world consumer
  signals from 190+ countries — who is buying what, for how much, from where, when, and
  why — using consumer activity data, computer vision, zero-party data collection, and
  250+ third-party integrations to inform marketing, sales, product, strategy, and
  growth decisions. Rwazi is a Techstars-backed company added to the API Evangelist
  network. This profile has been enriched from public web sources; at the time of
  enrichment Rwazi published no self-service developer API, OpenAPI, or public API
  reference — onboarding is enterprise, demo-driven, and account-based.
